<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#006064"><link rel="manifest" href="manifest.webmanifest"><title>Reis Office | Teste de câmera</title>
<style>
:root{font-family:Arial,sans-serif;color:#1f2937;background:#f3f6f8}*{box-sizing:border-box}body{margin:0}header{background:#006064;color:white;padding:18px 16px}h1{font-size:21px;margin:0}header p{font-size:13px;margin:6px 0 0}main{max-width:560px;margin:16px auto;padding:0 12px 28px}.card{background:white;border-radius:14px;padding:16px;box-shadow:0 2px 10px #0001}label{display:block;font-weight:700;margin:13px 0 6px}input,select,button{width:100%;font-size:16px;border-radius:9px}input,select{border:1px solid #cbd5e1;padding:12px;background:white}button{border:0;padding:14px;margin-top:12px;font-weight:700;color:white;background:#008577}button:disabled{opacity:.5}.secondary{background:#475569}video{display:block;width:100%;max-height:52vh;object-fit:contain;background:#0f172a;border-radius:10px;margin-top:12px}#preview{display:none;width:100%;max-height:45vh;object-fit:contain;background:#e2e8f0;border-radius:10px;margin-top:12px}#status{display:none;padding:12px;border-radius:8px;margin-top:12px;font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}.info{background:#e0f2fe;color:#075985}.hint{color:#64748b;font-size:12px;line-height:1.45}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tag{font-size:12px;background:#e2e8f0;padding:4px 8px;border-radius:999px;display:inline-block}
</style></head><body><header><h1>Reis Office · Teste de câmera</h1><p>Protótipo PWA independente — validação da câmera no Android</p></header>
<main><div class="card"><span class="tag">Etapa 1: testar câmera</span>
<label for="serial">Serial do notebook</label><input id="serial" placeholder="Ex.: C6TG7W3" autocomplete="off" autocapitalize="characters">
<label for="categoria">Categoria da foto</label><select id="categoria"><option value="FRENTE">Frente / tampa</option><option value="TELA">Tela ligada</option><option value="BASE_INFERIOR">Base inferior</option><option value="TECLADO">Teclado</option><option value="ETIQUETA_SERIAL">Etiqueta / Serial</option><option value="CARREGADOR">Carregador</option><option value="LATERAIS">Laterais / portas</option><option value="AVARIA">Avaria / detalhe adicional</option></select>
<button id="start">Abrir câmera traseira</button><video id="video" autoplay playsinline muted></video><div class="row"><button id="capture" disabled>Capturar foto</button><button id="stop" class="secondary" disabled>Fechar câmera</button></div><canvas id="canvas" hidden></canvas><img id="preview" alt="Prévia da captura"><div class="row"><button id="retake" class="secondary" disabled>Tirar novamente</button><button id="download" class="secondary" disabled>Salvar foto no celular</button></div><div id="status" role="status"></div><p class="hint">Este protótipo testa somente a câmera e a redução da imagem. Ainda não envia para o Google Drive. A integração com o Drive será feita depois de confirmarmos que a captura funciona.</p></div></main>
<script>
(()=>{const $=id=>document.getElementById(id);let stream=null,dataUrl=null;const video=$('video');
function status(message,type='info'){const el=$('status');el.textContent=message;el.className=type;el.style.display='block'}
function errorHelp(e){const name=e?.name||'Erro desconhecido',msg=e?.message||String(e);let advice='';if(name==='NotAllowedError'||name==='PermissionDeniedError')advice='O navegador ou sistema bloqueou a câmera. Confirme a permissão do site e o acesso geral à câmera do Android.';else if(name==='NotFoundError'||name==='DevicesNotFoundError')advice='Nenhuma câmera compatível foi encontrada.';else if(name==='NotReadableError'||name==='TrackStartError')advice='A câmera pode estar ocupada por outro aplicativo. Feche Câmera/WhatsApp e tente novamente.';else if(name==='OverconstrainedError')advice='O aparelho não aceitou as especificações solicitadas; tente novamente com configurações mais simples.';else if(name==='SecurityError')advice='O navegador bloqueou o acesso por segurança. Abra o PWA por um endereço HTTPS.';else advice='Tente fechar a câmera, recarregar a página e abrir novamente.';status(`Falha ao abrir câmera\nCódigo: ${name}\nDetalhe: ${msg}\n\nOrientação: ${advice}`,'err')}
async function startCamera(){if(!navigator.mediaDevices?.getUserMedia){status('Este navegador não disponibilizou getUserMedia. Abra a aplicação por HTTPS no Chrome atualizado.','err');return}await stopCamera(false);$('start').disabled=true;status('Solicitando acesso à câmera...','info');try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}});video.srcObject=stream;await video.play();$('capture').disabled=false;$('stop').disabled=false;status('Câmera aberta. Enquadre o notebook e toque em “Capturar foto”.','ok')}catch(e){errorHelp(e)}finally{$('start').disabled=false}}
async function stopCamera(show=true){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;$('capture').disabled=true;$('stop').disabled=true;if(show)status('Câmera fechada.','info')}
function capture(){if(!stream||!video.videoWidth||!video.videoHeight){status('A câmera ainda está iniciando. Aguarde alguns segundos e tente novamente.','err');return}const maxSide=1280,scale=Math.min(1,maxSide/Math.max(video.videoWidth,video.videoHeight)),canvas=$('canvas');canvas.width=Math.max(1,Math.round(video.videoWidth*scale));canvas.height=Math.max(1,Math.round(video.videoHeight*scale));const ctx=canvas.getContext('2d',{alpha:false});if(!ctx){status('Não foi possível preparar a captura.','err');return}ctx.drawImage(video,0,0,canvas.width,canvas.height);dataUrl=canvas.toDataURL('image/jpeg',0.72);$('preview').src=dataUrl;$('preview').style.display='block';$('retake').disabled=false;$('download').disabled=false;const approxKB=Math.round((dataUrl.length*3/4)/1024);status(`Captura realizada!\nSerial: ${$('serial').value.trim()||'(não informado)'}\nCategoria: ${$('categoria').selectedOptions[0].text}\nResolução final: ${canvas.width} × ${canvas.height}\nTamanho aproximado: ${approxKB} KB\n\nEsta versão é apenas para validar a câmera.`,'ok')}
function downloadPhoto(){if(!dataUrl)return;const serial=($('serial').value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g,'')||'SEM_SERIAL'),category=$('categoria').value,a=document.createElement('a');a.href=dataUrl;a.download=`${serial}_${category}.jpg`;document.body.appendChild(a);a.click();a.remove()}
$('start').addEventListener('click',startCamera);$('capture').addEventListener('click',capture);$('stop').addEventListener('click',()=>stopCamera(true));$('retake').addEventListener('click',()=>{dataUrl=null;$('preview').removeAttribute('src');$('preview').style.display='none';$('retake').disabled=true;$('download').disabled=true;status('Pronto para capturar novamente.','info')});$('download').addEventListener('click',downloadPhoto);window.addEventListener('pagehide',()=>{if(stream)stream.getTracks().forEach(t=>t.stop())});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))})();
</script></body></html>
